name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A second push to the same PR cancels the first run — CI feedback on a stale
# commit is worse than none, and it wastes minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    env:
      # `next build` prerenders client components that construct a Supabase
      # browser client, and @supabase/ssr throws on a missing/invalid URL. These
      # are throwaway placeholders that satisfy the constructor — CI never talks
      # to a real project, and no secret is needed to prove the app compiles.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_TELEMETRY_DISABLED: '1'
      # Every feature flag stays unset, which is also the production default
      # until the P14 runbook flips them — so CI builds what production runs.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22+ is required: the unit tests import `lib/*.ts` directly and
          # rely on Node's built-in type stripping (see Plan 2.5).
          node-version: 22.x
          cache: npm

      # `npm ci` (not `npm install`) so the lockfile is authoritative and the
      # `overrides` security pins cannot be silently resolved away.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The previous workflow named its job "test" and never ran the tests.
      - name: Unit tests
        run: npm test

      # Offline, deterministic evals: mermaid parse rate, schema robustness and
      # the prompt-injection screener. No network, no AI provider, no cost.
      - name: Offline evals
        run: npm run eval

      - name: Build
        run: npm run build

  audit:
    name: Dependency audit (report only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Deliberately NOT a gate. There is a standing set of high-severity
      # advisories in transitive dependencies that cannot be resolved without
      # breaking changes, so failing on them would make every PR red and teach
      # everyone to ignore CI. This surfaces the report; the `overrides` block in
      # package.json is what actually pins the fixable ones.
      - name: Audit
        run: npm audit --audit-level=high || true
